{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- load sidebar -->
    {% include 'dashboard/sidebar.html' %}


    <!-- right side content -->
    <div class="col-md-9">
        <h3>Edit Category</h3>

        <form action="{% url 'edit_category' category.id %}" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">Save</button>
        </form>
    </div>
</div>

{% endblock %}
