{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="row">
    <!-- load sidebar -->
    {% include 'dashboard/sidebar.html' %}


    <!-- right side content -->
    <div class="col-md-9">
        {% if perms.auth.add_user %}
        <h3>Add User</h3>
 
        <form action="{% url 'edit_user' user.id %}" method="POST" >
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Save</button>
        </form>
        {% else %}
        <h5>You don't have permission to view this page</h5>
        {% endif %}
    </div>
</div>

{% endblock %}
