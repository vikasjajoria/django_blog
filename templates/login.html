{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<h3 class="text-center">Login</h3>
<form action="{% url 'login' %}" method="POST">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-warning" style="width: 500px; margin: auto;">Submit</button>
</form>

{% endblock %}
